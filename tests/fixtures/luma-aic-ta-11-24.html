<script data-cfasync="false" type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"Event","@id":"https://luma.com/aic-ta-11-24","url":"https://luma.com/aic-ta-11-24","name":"Lovable Promptathon Bucharest: From Vibe to Live (w/ The AI Collective)","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","location":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"RO","addressLocality":"București","addressRegion":"6","streetAddress":"Builders House"},"name":"Builders House","geo":{"@type":"GeoCoordinates","latitude":44.4307121,"longitude":26.0540725},"latitude":44.4307121,"longitude":26.0540725},"image":["https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=1,anim=false,background=white,quality=75,width=1920,height=1920/uploads/2c/923474a7-e6b8-4a1d-9c9a-7b246e72a48e.jpg","https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=1,anim=false,background=white,quality=75,width=1200,height=630/event-social/ml/b087e294-4226-49c1-8c34-8ec39aeb52b4.png"],"description":"Not just vibe the idea — live it, across two cities. This is a hands-on evening workshop by The AI Collective Bucharest × The AI Collective Taiwan, supported by Lovable, and the second leg of a two-city Promptathon: From Vibe to Live. On Nov 12, builders in Taipei shipped apps in a 1-hour Promptathon and voted their top 3. Tonight in Bucharest, your team picks any Taiwan project, remixes it and takes it further — everyone takes turns prompting — then the room votes Bucharest's top 3, with prizes for the winning teams. New to Lovable? Perfect. No coding experience needed — Lovable credits provided for participants.\nAgenda\n4:00 PM — Doors open: check-in, food & drinks — create your Lovable account and claim credits together\n4:30 PM — Welcome: The AI Collective Bucharest × Taipei, Lovable & how the two-city Promptathon works\n4:40 PM — Knowledge sharing: how Lovable works, prompting tips, how to remix a project, live demo from idea to app\n5:10 PM — 5-credit challenge: build your own event host website step by step, using just 5 credits\n5:40 PM — Break & meet the Globla SheBuilds & Taipei builds: browse the provided sample, form teams & pick one to remix\n6:00 PM — Promptathon (3 hrs min): in teams, take turns prompting one after another, then publish & submit\n9:00 PM — Promptathon team demos & audience vote\n9:30 PM — Prizes for Bucharest's top 3, group photo & share (tag Lovable & The AI Collective, #LovableAmbassador)\n9:40 PM — Networking & close (until 10:00 PM)\nBring: your laptop and charger. No idea needed — Taipei has already started the projects for you.\nSupported by Lovable\nThis event receives in-kind support from Lovable (Lovable credits for participants) and is led by Grace Pan, Lovable Ambassador — City Lead (Taipei), co-hosted by The AI Collective Bucharest and The AI Collective Taiwan.\nThis is an unofficial, community-run event. Sharing your build or event photos? Use #LovableAmbassador and tag Lovable & The AI Collective.\nAs always, food and drink, engaging conversation, and incredible company will all be provided!\nPlease be advised: Unfortunately, space is very limited at these community events and we can not always accept everyone we would like to. If you are not accepted to this event, please keep applying! We appreciate your application tremendously and we are looking forward to seeing you at a future event very soon!\n\n\n\n\nThe AI Collective is a global non-profit building the human layer for the AI era. We unite 200,000+ leaders, builders, and stakeholders across 100+ forums worldwide to democratize the frontier, build trust, and coordinate how society navigates the rapid acceleration of technological progress.\nAll attendees and organizers at events affiliated with The AI Collective agree to our privacy policy and are subject to our code of conduct.","startDate":"2026-11-24T16:00:00.000+02:00","endDate":"2026-11-24T22:00:00.000+02:00","organizer":[{"@type":"Organization","name":"The AI Collective","url":"https://luma.com/genai-collective","image":"https://images.lumacdn.com/calendars/0w/e35ab921-a45a-454e-b3dd-20501c0698fe.png"},{"@type":"Person","name":"The AI Collective","url":"https://luma.com/user/aicollective","image":"https://images.lumacdn.com/avatars/hh/cd5d1d15-197e-4e13-b76c-55315ba1e8c6.png"},{"@type":"Person","name":"Grace Pan","url":"https://luma.com/user/usr-JlENSXktzkR24En","image":"https://images.lumacdn.com/avatars/e3/d19c9af9-bcfd-4a15-80be-fb992ab97167.jpg"},{"@type":"Person","name":"Irina Raicu","url":"https://luma.com/user/irinaraicu","image":"https://images.lumacdn.com/uploads/50/cf78ab07-6848-412f-851a-123291d57267.jpg"},{"@type":"Person","name":"Ioana Mihăilescu","url":"https://luma.com/user/usr-iZJIdc3Oa85tveK","image":"https://images.lumacdn.com/uploads/xn/e08bd6ff-1374-4d9e-8d58-c765d22e7f0a.jpg"},{"@type":"Person","name":"Roxana Chiriacescu","url":"https://luma.com/user/usr-aXxNx3r9BLA3t6Z","image":"https://images.lumacdn.com/uploads/dt/dcb56aaf-4b87-4236-9a2e-63edef66be18.jpg"},{"@type":"Person","name":"Ioana Ioanas","url":"https://luma.com/user/usr-gqX3jR27DYowL2R","image":"https://images.lumacdn.com/avatars/y7/06abe3d6-46d6-44db-b338-ffc77bead377.jpg"},{"@type":"Person","name":"Matei Ștefan","url":"https://luma.com/user/MateiSeneca","image":"https://images.lumacdn.com/uploads/l9/6458df8e-5b62-4dac-9f43-c6b26b59b381.jpg"},{"@type":"Person","name":"Alexandru Agatinei","url":"https://luma.com/user/agatinei","image":"https://images.lumacdn.com/avatars/3c/49bd848d-f91c-40da-b5f7-d2798f4b43b1.jpg"}],"offers":[{"@type":"Offer","url":"https://luma.com/aic-ta-11-24","name":"General Admission","price":0,"priceCurrency":"usd","availability":"https://schema.org/InStock"}]}</script>
