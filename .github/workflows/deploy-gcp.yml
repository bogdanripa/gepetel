name: Deploy to Cloud Functions (rollback only)

# ROLLBACK LEVER — deliberately manual.
#
# Gepetel runs on the Pi (.github/workflows/deploy.yml). The Cloud Function is kept
# deployed and frozen at the last revision that served production, so going back is
# repointing the wa-gateway webhook at it and re-enabling its Cloud Scheduler jobs —
# no build required. This workflow exists to redeploy that function on purpose; the
# push trigger is removed so main no longer ships to two places at once.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: gepetel
          workload_identity_provider: projects/168374214147/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-deployer@gepetel.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy function
        run: |
          # Which WhatsApp gateway Gepetel talks to (see src/wa.ts): "whapi" or
          # "wa-gateway". WA_GATEWAY_TOKEN only exists once the wa-gateway number
          # has been paired, so attach it only if the secret is there — a missing
          # secret must not fail a deploy that isn't using it.
          SECRETS="WHAPI_TOKEN=WHAPI_TOKEN:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GEPETEL_DATABASE_URL=GEPETEL_DATABASE_URL:latest,CRON_SECRET=CRON_SECRET:latest,CREATOR_PHONE=CREATOR_PHONE:latest,PAYMENT_SECRET=PAYMENT_SECRET:latest,PUBLIC_API_KEY=PUBLIC_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest"
          if gcloud secrets describe WA_GATEWAY_TOKEN --project=gepetel >/dev/null 2>&1; then
            SECRETS="$SECRETS,WA_GATEWAY_TOKEN=WA_GATEWAY_TOKEN:latest"
          else
            echo "::warning::WA_GATEWAY_TOKEN secret not found — deploying without it — sends keep going through whapi until it exists (see src/wa.ts)."
          fi

          gcloud functions deploy gepetel \
            --gen2 \
            --project=gepetel \
            --region=europe-west3 \
            --runtime=nodejs22 \
            --source=. \
            --entry-point=app \
            --trigger-http \
            --allow-unauthenticated \
            --service-account=gepetel-runtime@gepetel.iam.gserviceaccount.com \
            --set-secrets="$SECRETS" \
            --update-env-vars="WA_PROVIDER=wa-gateway,WA_GATEWAY_URL=https://wa-gateway-coolify.bogdanripa.com/api,WA_GATEWAY_PHONE_NUMBER_ID=gepetel" \
            --memory=512Mi \
            --timeout=300
